[workspace]
resolver = "2"
members = [
    "orbit-cli",
    "orbit-core",
    "orbit-launcher-cli",
    "orbit-launcher-core",
    "orbit-gui",
    "orbit-i18n",
    "orbit-machine-protocol",
    "orbit-bytecode-audit",
    "orbit-loader-json",
    "curseforge-wrapper",
    "modrinth-wrapper",
]
exclude = ["pubgrub-fork"]

[workspace.dependencies]
# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.22.27"
# 加密
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
# HTTP
reqwest = { version = "0.13.2", features = ["json", "query", "form"] }
scraper = "0.27.0"
html2text = "0.17.1"
# 异步
tokio = { version = "1.51.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
async-trait = "0.1"
futures-util = "0.3"
zeroize = { version = "1.8", features = ["derive"] }
regex = "1.13.1"
os_info = "3.15.0"
shell-words = "1.1.1"
# CLI
clap = { version = "4.6.0", features = ["derive"] }
indicatif = "0.18"
comfy-table = "7.2.2"
# 错误处理
anyhow = "1.0.102"
thiserror = "2.0.18"
# 工具
url = "2.5.8"
zip = "3.0.0"
indexmap = { version = "2.0", features = ["serde"] }
ristretto_classfile = "0.31.0"
tempfile = "3.27"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
md-5 = "0.10"
base64 = "0.22"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
fs2 = "0.4"
dunce = "1.0.5"
orbit-loader-json = { path = "orbit-loader-json" }
orbit-machine-protocol = { path = "orbit-machine-protocol" }
orbit-i18n = { path = "orbit-i18n" }
