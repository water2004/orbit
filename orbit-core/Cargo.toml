[package]
name = "orbit-core"
version = "0.3.0"
edition = "2024"
description = "Core business logic for Orbit — the Minecraft mod package manager"

[features]
default = []
# Select executable-adjacent paths as the compiled default. Runtime callers can
# still choose the system layout or pass exact paths.
portable = []

[dependencies]
# 内部依赖
curseforge-wrapper = { path = "../curseforge-wrapper" }
modrinth-wrapper = { path = "../modrinth-wrapper" }
orbit-bytecode-audit = { path = "../orbit-bytecode-audit" }
orbit-bundle-format.workspace = true
orbit-compatibility.workspace = true
orbit-loader-json.workspace = true

# 工作区共享依赖
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
sha2.workspace = true
sha1.workspace = true
hex.workspace = true
url.workspace = true
zip.workspace = true
async-trait.workspace = true
futures-util.workspace = true
fs2.workspace = true
anyhow.workspace = true
thiserror.workspace = true
indexmap.workspace = true
tempfile.workspace = true
image.workspace = true
java-properties.workspace = true
rusqlite.workspace = true
base64.workspace = true
dunce.workspace = true
pubgrub = { git = "https://github.com/water2004/pubgrub.git", rev = "19e9622e48fe37f62abd9e270e356aab5ec2e2f6" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
bytes = "1.11"
http-body-util = "0.1"
hyper = { version = "1.9", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { workspace = true, features = ["net"] }
