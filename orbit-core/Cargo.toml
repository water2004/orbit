[package]
name = "orbit-core"
version = "0.1.0"
edition = "2024"
description = "Core business logic for Orbit — the Minecraft mod package manager"

[features]
default = []
# Select executable-adjacent paths as the compiled default. Runtime callers can
# still choose the system layout or pass exact paths.
portable = []

[dependencies]
# 内部依赖
curseforge-wrapper = { path = "../curseforge-wrapper" }
modrinth-wrapper = { path = "../modrinth-wrapper" }
orbit-bytecode-audit = { path = "../orbit-bytecode-audit" }

# 工作区共享依赖
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
sha1 = "0.10"
hex.workspace = true
url.workspace = true
zip.workspace = true
async-trait.workspace = true
anyhow.workspace = true
thiserror.workspace = true
indexmap.workspace = true
pubgrub = { git = "https://github.com/water2004/pubgrub.git", rev = "c334509daecf91611af2729b2db91af7eba6f076" }

[dev-dependencies]
bytes = "1.11"
http-body-util = "0.1"
hyper = { version = "1.9", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { workspace = true, features = ["net"] }
tempfile = "3.20"
