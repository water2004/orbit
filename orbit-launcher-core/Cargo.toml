[package]
name = "orbit-launcher-core"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "Platform-independent core for Orbit Launcher"

[dependencies]
orbit-compatibility.workspace = true
orbit-bundle-format.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
dunce = { workspace = true }
reqwest = { workspace = true }
scraper = { workspace = true }
html2text = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
hex = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
zeroize = { workspace = true }
tokio = { workspace = true }
regex = { workspace = true }
os_info = { workspace = true }
shell-words = { workspace = true }
zip = { workspace = true }
md-5 = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
fs2 = { workspace = true }
java-properties = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Memory"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.1.0", features = ["rt-tokio-crypto-rust"] }

[dev-dependencies]
