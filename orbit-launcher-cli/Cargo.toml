[package]
name = "orbit-launcher"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Cross-platform Minecraft runtime launcher"
authors = ["Yuan Shui"]
repository = "https://github.com/water2004/orbit"

[package.metadata.deb]
name = "orbit-launcher"
maintainer = "Yuan Shui <water2004@users.noreply.github.com>"
copyright = "2026, Yuan Shui"
license-file = ["../LICENSE", "0"]
extended-description = """\
Orbit Launcher installs and launches verified Minecraft Java client and \
dedicated-server runtimes without managing mods."""
depends = "$auto"
section = "games"
priority = "optional"
assets = [
    ["target/release/orbit-launcher", "usr/bin/", "755"],
    ["../docs/orbit-launcher-cli.md", "usr/share/doc/orbit-launcher/README.md", "644"],
]

[[bin]]
name = "orbit-launcher"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
orbit-launcher-core = { path = "../orbit-launcher-core" }
orbit-machine-protocol.workspace = true
orbit-i18n = { workspace = true, features = ["clap"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
zeroize = { workspace = true }
rpassword = "7.4"
fs2 = { workspace = true }

[dev-dependencies]
dunce = { workspace = true }
tempfile = { workspace = true }
