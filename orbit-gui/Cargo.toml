[package]
name = "orbit-gui"
version = "0.6.4"
edition = "2024"
license = "GPL-3.0-only"
description = "Vue/Tauri desktop shell for Orbit and Orbit Launcher"
repository = "https://github.com/water2004/orbit"
build = "build.rs"

# These are consumed by build.rs to rasterize and embed the Windows icon.
# cargo-machete does not currently attribute those build-script references.
[package.metadata.cargo-machete]
ignored = ["resvg", "tauri-build"]

[package.metadata.deb]
name = "orbit-gui"
maintainer = "Yuan Shui <water2004@users.noreply.github.com>"
copyright = "2026, Yuan Shui"
license-file = ["ui/LICENSE", "0"]
extended-description = """\
Orbit GUI is the native desktop shell for the Orbit mod package manager and \
Orbit Launcher. It delegates all domain operations to the two command-line \
programs through their machine-readable protocols."""
depends = "orbit (= 0.6.4-1), orbit-launcher (= 0.6.4-1), $auto"
section = "games"
priority = "optional"
assets = [
    ["target/release/orbit-gui", "usr/bin/", "755"],
    ["../assets/orbit.desktop", "usr/share/applications/orbit.desktop", "644"],
    ["../assets/orbit.svg", "usr/share/icons/hicolor/scalable/apps/orbit.svg", "644"],
    ["../docs/orbit-gui.md", "usr/share/doc/orbit-gui/README.md", "644"],
    ["ui/UPSTREAM.md", "usr/share/doc/orbit-gui/UPSTREAM.md", "644"],
]

[[bin]]
name = "orbit-gui"
path = "src/main.rs"

[features]
# Packaging uses cargo directly, so embedded frontend assets must be the default.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
anyhow = { workspace = true }
command-group = "5.0.1"
directories = "6.0.0"
orbit-i18n = { workspace = true }
orbit-machine-protocol = { workspace = true }
tempfile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zeroize = { workspace = true }

tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[build-dependencies]
tauri-build = "2"
resvg = "0.45.1"
