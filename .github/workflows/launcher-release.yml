name: Orbit Launcher release packages

on:
  push:
    tags:
      - "launcher-v*"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate launcher release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require the tag commit to be on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME does not point to a commit contained in main." >&2
            exit 1
          fi

      - name: Require the tag and release notes to match Cargo
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(
            cargo metadata \
              --format-version 1 \
              --no-deps \
              --manifest-path orbit-launcher-cli/Cargo.toml |
              jq -r '.packages[] | select(.name == "orbit-launcher") | .version'
          )"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Launcher releases require a three-field Cargo version; found $version." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "launcher-v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME must equal launcher-v$version." >&2
            exit 1
          fi
          notes="docs/launcher-releases/v$version.md"
          if [[ ! -s "$notes" ]]; then
            echo "Required Orbit Launcher release notes are missing: $notes" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run launcher tests
        run: cargo test --locked --package orbit-launcher-core --package orbit-launcher

  windows-msi:
    name: Build Orbit Launcher Windows MSI
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build and validate MSI
        shell: pwsh
        run: ./scripts/build-launcher-windows-msi.ps1
      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: orbit-launcher-${{ needs.validate.outputs.version }}-windows-msi
          path: target/wix/orbit-launcher-${{ needs.validate.outputs.version }}-x86_64.msi
          if-no-files-found: error

  linux-deb:
    name: Build Orbit Launcher Linux deb
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install pinned Debian packager
        run: cargo install cargo-deb --version 3.7.0 --locked
      - name: Build and validate deb
        run: bash ./scripts/build-launcher-linux-deb.sh
      - name: Upload deb
        uses: actions/upload-artifact@v7
        with:
          name: orbit-launcher-${{ needs.validate.outputs.version }}-linux-deb
          path: target/debian/orbit-launcher_${{ needs.validate.outputs.version }}-1_amd64.deb
          if-no-files-found: error

  publish:
    name: Publish Orbit Launcher release
    needs:
      - validate
      - windows-msi
      - linux-deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: orbit-launcher-${{ needs.validate.outputs.version }}-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum *.msi *.deb > SHA256SUMS
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dist/*.msi \
            dist/*.deb \
            dist/SHA256SUMS \
            --verify-tag \
            --title "Orbit Launcher $VERSION" \
            --notes-file "docs/launcher-releases/v$VERSION.md" \
            --fail-on-no-commits
