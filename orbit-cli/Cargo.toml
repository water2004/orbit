[package]
name = "orbit"
version = "0.1.2"
edition = "2024"
authors = ["Yuan Shui"]
description = "A non-intrusive package manager for Minecraft mods"
license = "MIT"
repository = "https://github.com/water2004/orbit"

[package.metadata.deb]
maintainer = "Yuan Shui <water2004@users.noreply.github.com>"
copyright = "2026, Yuan Shui"
license-file = ["../LICENSE", "0"]
extended-description = """\
Orbit manages Minecraft mod instances from JAR-declared metadata, resolves \
dependencies across supported providers, keeps reproducible manifests and \
lockfiles, and includes the native Orbit desktop application and runtime \
launcher."""
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/orbit", "usr/bin/", "755"],
    ["target/release/orbit-launcher", "usr/bin/", "755"],
    ["target/release/orbit-gui", "usr/bin/", "755"],
    ["../assets/orbit.desktop", "usr/share/applications/orbit.desktop", "644"],
    ["../assets/orbit.svg", "usr/share/icons/hicolor/scalable/apps/orbit.svg", "644"],
    ["../README.md", "usr/share/doc/orbit/README.md", "644"],
    ["../docs/orbit-gui.md", "usr/share/doc/orbit/orbit-gui.md", "644"],
]

[features]
default = []
portable = ["orbit-core/portable"]

[dependencies]
# 内部依赖
orbit-core = { path = "../orbit-core" }
orbit-machine-protocol.workspace = true
orbit-i18n = { workspace = true, features = ["clap"] }

# 工作区依赖
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
indicatif.workspace = true
comfy-table.workspace = true
